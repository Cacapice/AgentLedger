services:
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_USER: agentledger, POSTGRES_PASSWORD: agentledger, POSTGRES_DB: agentledger}
    ports: ["55432:5432"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U agentledger"], interval: 2s, timeout: 2s, retries: 30}
  mysql:
    image: mysql:8.4
    environment: {MYSQL_ROOT_PASSWORD: root, MYSQL_DATABASE: agentledger, MYSQL_USER: agentledger, MYSQL_PASSWORD: agentledger}
    ports: ["53306:3306"]
    healthcheck: {test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"], interval: 3s, timeout: 3s, retries: 40}
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-06T17-38-46Z
    command: server /data --console-address :9001
    environment: {MINIO_ROOT_USER: minioadmin, MINIO_ROOT_PASSWORD: minioadmin}
    ports: ["59000:9000", "59001:9001"]
    healthcheck: {test: ["CMD", "mc", "ready", "local"], interval: 5s, timeout: 5s, retries: 20}
