name: quality-gate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: python -m pip install --upgrade pip
      - run: pip install -e 'packages/python[crypto,test]'
      - run: ruff check --select F packages/python/src packages/python/tests
      - run: mypy packages/python/src/agent_ledger
      - run: pytest packages/python/tests -q
      - run: python -m build packages/python
  typescript-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: {node-version: '22', }
      - run: npm install
        working-directory: packages/typescript
      - run: npm run check
        working-directory: packages/typescript
  go-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with: {go-version: '1.22'}
      - run: test -z "$(gofmt -l .)"
        working-directory: go
      - run: go vet ./...
        working-directory: go
      - run: go test -race ./...
        working-directory: go
  rust-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with: {components: rustfmt, clippy}
      - run: cargo fmt --check
        working-directory: rust
      - run: cargo clippy --all-targets --all-features -- -D warnings
        working-directory: rust
      - run: cargo test
        working-directory: rust
