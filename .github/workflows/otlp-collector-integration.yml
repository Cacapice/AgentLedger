name: otlp-collector-integration
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  collector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e './packages/python[crypto,test]'
      - run: pytest -q tests/test_otlp_transport_extended.py
      - name: Start live collector
        run: |
          docker run -d --name otel-collector -p 4318:4318 -v "$PWD/tests/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro" otel/opentelemetry-collector-contrib:0.111.0
          sleep 5
          docker logs otel-collector
      - name: Collector smoke test
        env:
          OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:4318
        run: |
          python - <<'PYTEST'
          from agent_ledger.otlp_transport import export_log, export_span, export_counter
          import time
          export_log({'event_id':'smoke','agent_id':'ci','action_type':'test','execution_status':'ok'})
          export_span('1'*32,'2'*16,'smoke',time.time_ns()-1000,time.time_ns())
          export_counter('agentledger.smoke',1,time.time_ns())
          PYTEST
