name: integration-certification
on: [push, pull_request]
jobs:
  real-adapters:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: agentledger, POSTGRES_PASSWORD: agentledger, POSTGRES_DB: agentledger}
        ports: [5432:5432]
        options: >-
          --health-cmd="pg_isready -U agentledger" --health-interval=5s --health-timeout=3s --health-retries=20
      mysql:
        image: mysql:8.4
        env: {MYSQL_ROOT_PASSWORD: root, MYSQL_DATABASE: agentledger, MYSQL_USER: agentledger, MYSQL_PASSWORD: agentledger}
        ports: [3306:3306]
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot" --health-interval=5s --health-timeout=5s --health-retries=30
      minio:
        image: quay.io/minio/minio:RELEASE.2025-09-06T17-38-46Z
        env: {MINIO_ROOT_USER: minioadmin, MINIO_ROOT_PASSWORD: minioadmin}
        ports: [9000:9000]
        options: >-
          --health-cmd="mc ready local" --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      AGENTLEDGER_POSTGRES_DSN: postgresql://agentledger:agentledger@localhost:5432/agentledger
      AGENTLEDGER_MYSQL_URL: mysql://agentledger:agentledger@localhost:3306/agentledger
      AGENTLEDGER_S3_ENDPOINT: http://localhost:9000
      AGENTLEDGER_S3_BUCKET: agentledger-test
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -e 'packages/python[production,test]'
      - run: pytest -q packages/python/tests/test_real_services.py
