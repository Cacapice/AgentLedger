name: integration-certification
on: [push, pull_request]
jobs:
  real-adapters:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: agentledger, POSTGRES_PASSWORD: agentledger, POSTGRES_DB: agentledger}
        ports: [5432:5432]
        options: >-
          --health-cmd="pg_isready -U agentledger" --health-interval=5s --health-timeout=3s --health-retries=20
      mysql:
        image: mysql:8.4
        env: {MYSQL_ROOT_PASSWORD: root, MYSQL_DATABASE: agentledger, MYSQL_USER: agentledger, MYSQL_PASSWORD: agentledger}
        ports: [3306:3306]
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot" --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      AGENTLEDGER_POSTGRES_DSN: postgresql://agentledger:agentledger@localhost:5432/agentledger
      AGENTLEDGER_MYSQL_URL: mysql://agentledger:agentledger@localhost:3306/agentledger
      AGENTLEDGER_S3_ENDPOINT: http://127.0.0.1:9000
      AGENTLEDGER_S3_BUCKET: agentledger-test
      AWS_ACCESS_KEY_ID: agentledger
      AWS_SECRET_ACCESS_KEY: agentledger
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install integration dependencies
        run: |
          pip install -e 'packages/python[production,test]'
          pip install 'moto[server]>=5,<6'
      - name: Start S3-compatible test endpoint
        run: |
          moto_server -H 127.0.0.1 -p 9000 > /tmp/agentledger-moto.log 2>&1 &
          echo $! > /tmp/agentledger-moto.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:9000/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/agentledger-moto.log
          exit 1
      - name: Certify real adapters
        run: pytest -q packages/python/tests/test_real_services.py
