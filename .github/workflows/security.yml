name: security
on:
  push:
  pull_request:
  schedule:
    - cron: '17 5 * * 1'
permissions:
  contents: read
  security-events: write
jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pip-audit
      - run: pip-audit -r <(python -c "import tomllib; d=tomllib.load(open('packages/python/pyproject.toml','rb')); print(chr(10).join(d['project']['dependencies']))")
        shell: bash
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --package-lock-only && npm audit --audit-level=high
        working-directory: packages/typescript
  codeql:
    uses: github/codeql-action/.github/workflows/codeql.yml@v4
    with:
      languages: python,javascript-typescript,go
