name: Runtime conformance
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -e 'packages/python[crypto]' pytest
      - run: pytest packages/python/tests -q
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: {node-version: '22'}
      - run: npm install
        working-directory: packages/typescript
      - run: npm test
        working-directory: packages/typescript
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: {go-version: '1.22'}
      - run: go run ./cmd/agentledger-go conformance ../contracts/conformance/runtime_semantics.v1.json
        working-directory: go
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --quiet
        working-directory: rust
      - run: cargo run --quiet -- conformance ../contracts/conformance/runtime_semantics.v1.json
        working-directory: rust
