[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-ledger"
version = "0.9.2"
description = "Tamper-evident audit SDK and verifier for autonomous agent actions"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.13.5,<3"]
license = {text = "Apache-2.0"}
authors = [{name = "Agent Ledger contributors"}]
keywords = ["ai", "agents", "audit", "governance", "provenance", "mcp"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent"
]

[project.optional-dependencies]
analytics = ["pandas>=2.0"]
production = ["psycopg[binary]>=3.2", "PyMySQL>=1.2.3", "boto3>=1.35"]
test = ["pytest>=8", "hypothesis>=6.112", "ruff>=0.6", "mypy>=1.11", "build>=1.2"]
crypto = ["cryptography>=43"]

[project.scripts]
agent-ledger = "agent_ledger.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# CI lint baseline: Pyflakes correctness checks. Formatting/style is enforced
# by language formatters rather than retroactively failing legacy compact code.
select = ["F"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true

