[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-ledger"
version = "0.4.1"
description = "Tamper-evident audit SDK and verifier for autonomous agent actions"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.7,<3"]

[project.optional-dependencies]
analytics = ["pandas>=2.0"]
license = {text = "Apache-2.0"}
authors = [{name = "Agent Ledger contributors"}]
keywords = ["ai", "agents", "audit", "governance", "provenance", "mcp"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent"
]

[project.scripts]
agent-ledger = "agent_ledger.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
