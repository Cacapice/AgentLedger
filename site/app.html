<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent Ledger Console</title><link rel="stylesheet" href="styles.css"></head><body>
<header><a class="brand" href="index.html">Agent Ledger</a><nav><a href="#account">Account</a><a href="#usage">Usage</a><a href="#keys">API keys</a><a href="#inventory">Inventory</a><a href="#audit">Audit</a></nav></header>
<main><section class="hero"><p class="eyebrow">CONTROL PLANE</p><h1>Agent Ledger Console</h1><p class="lede">Create an account or sign in, then manage your tenant, API keys, usage and evidence.</p></section>
<section id="account" class="panel"><div><h2>Account</h2><p id="authStatus" class="muted">Not signed in.</p><div class="checkout-grid"><label>API base URL<input id="apiBase" placeholder="https://agent-ledger-ingestion.example.workers.dev"></label><label>Email<input id="email" type="email"></label><label>Password<input id="password" type="password"></label><label>Organization<input id="organization"></label></div><div class="actions"><button id="signup" class="primary-btn">Create account</button><button id="login" class="primary-btn">Sign in</button><button id="logout">Sign out</button></div><pre id="firstKey" hidden></pre></div></section>
<section id="usage" class="panel"><div><h2>Usage</h2><p id="usageSummary" class="muted">Sign in to load usage.</p><div class="meter"><div id="usageBar"></div></div><pre id="usageJson"></pre></div></section>
<section id="keys" class="panel"><div><h2>API keys</h2><div class="actions"><input id="keyLabel" placeholder="SDK key"><button id="createKey" class="primary-btn">Create key</button><button id="refreshKeys">Refresh</button></div><div id="keyList"></div><pre id="newKey" hidden></pre></div></section>
<section id="inventory" class="panel"><div><h2>Agent & policy inventory</h2><button id="refreshInventory">Refresh inventory</button><pre id="inventoryJson"></pre></div></section>
<section id="audit" class="panel"><div><h2>Audit search & evidence</h2><div class="actions"><input id="auditQuery" placeholder="tool, principal or trace"><button id="searchAudit">Search</button><button id="exportEvidence">Export evidence JSON</button></div><pre id="auditJson"></pre></div></section>
</main><script src="app.js" defer></script></body></html>
